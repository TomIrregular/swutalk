name: SWUTalk CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  # Job 1: รัน Unit Test & UI Test
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
    - name: Install dependencies
      run: |
        cd chatapp
        npm install
    - name: Run Jest Tests
      run: |
        cd chatapp
        npm test

  # Job 2: รัน Static Analysis (Plato) แบบขนานไปกับ Job 1
  static-analysis:
    name: Static Profiling (Plato)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
    - name: Install dependencies
      run: |
        cd chatapp
        npm install
    - name: Run Plato Profiling
      run: |
        cd chatapp
        npm run plato
    - name: Upload Plato Report
      uses: actions/upload-artifact@v4
      with:
        name: plato-reports
        path: chatapp/report/

  # Job 3: รัน Load Testing (Autocannon) แบบขนาน
  load-test:
    name: Dynamic Profiling (Autocannon)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
    - name: Install dependencies
      run: |
        cd chatapp
        npm install
    - name: Run Load Test with Clinic.js
      run: |
        cd chatapp
        npm run performance
    - name: Upload Performance Reports
      uses: actions/upload-artifact@v4
      with:
        name: performance-reports
        path: chatapp/report/
  
  #Job 4 Deploy
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [test, static-analysis, load-test]  # รอให้ CI ผ่านก่อนทุก Job
    if: github.ref == 'refs/heads/main'  # Deploy เฉพาะ push to main
    steps:
    - name: Trigger Render Deploy
      run: |
        curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}